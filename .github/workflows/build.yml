name: Build Remote 3 Activity Lock

on:
  push:
    branches: [main, activity-lock]
    paths:
      - 'tools/**'
      - '.github/workflows/**'
      - 'README.md'
  pull_request:
  workflow_dispatch:

env:
  UPSTREAM_COMMIT: f3d34daea76239a92b5d43793f9eb849e5d0fc19
  BIN_OUTPUT_PATH: binaries

jobs:
  embedded-arm64:
    name: Remote 3 ARM64 build
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout overlay
        uses: actions/checkout@v4
        with:
          path: overlay

      - name: Checkout upstream remote-ui
        uses: actions/checkout@v4
        with:
          repository: unfoldedcircle/remote-ui
          ref: ${{ env.UPSTREAM_COMMIT }}
          path: remote-ui
          submodules: recursive
          fetch-depth: 0

      - name: Apply Activity Lock patch
        run: python3 overlay/tools/apply_activity_lock.py remote-ui

      - name: Prepare official upstream build layout
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p remote-ui/build
          mkdir -p remote-ui/binaries

      - name: Build with official upstream ARM64 toolchain
        shell: bash
        run: |
          set -euxo pipefail
          docker pull unfoldedcircle/r2-toolchain-qt-5.15.8-static
          docker run --rm \
            --user=$(id -u):$(id -g) \
            -v "${GITHUB_WORKSPACE}/remote-ui:/sources" \
            unfoldedcircle/r2-toolchain-qt-5.15.8-static

      - name: Locate and verify ARM64 binary
        shell: bash
        run: |
          set -euxo pipefail
          echo "Build output tree:"
          find remote-ui/binaries -maxdepth 5 -type f -print | sort

          BINARY="$(find remote-ui/binaries -type f -name 'remote-ui' -perm -u+x | head -n 1)"
          test -n "$BINARY"
          test -s "$BINARY"

          file "$BINARY"
          file "$BINARY" | grep -Ei 'ARM aarch64|ARM64'

          echo "BINARY=$BINARY" >> "$GITHUB_ENV"

      - name: Build validated custom UI installation package
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf custom-ui-package
          mkdir -p custom-ui-package/bin custom-ui-package/config custom-ui-package/data

          cp "$BINARY" custom-ui-package/bin/remote-ui
          chmod +x custom-ui-package/bin/remote-ui

          cat > custom-ui-package/release.json <<'JSON'
          {
            "name": {
              "en": "Remote 3 Activity / Child Lock"
            },
            "version": "0.1.0-activity-lock",
            "description": {
              "en": "Custom Remote 3 UI with an optional activity / child lock."
            },
            "developer": {
              "name": "celle150190-prog"
            },
            "home_page": "https://github.com/celle150190-prog/uc-remote3-activity-lock",
            "release_date": "2026-08-30",
            "requirements": {
              "firmware_version": ">=2.10.1,<3.0.0"
            }
          }
          JSON

          python3 -m json.tool custom-ui-package/release.json >/dev/null
          test -x custom-ui-package/bin/remote-ui
          test -s custom-ui-package/bin/remote-ui
          test -d custom-ui-package/config
          test -d custom-ui-package/data

          tar -tzf /dev/null 2>/dev/null || true
          tar czvf remote3-activity-lock-custom-ui.tar.gz -C custom-ui-package .

          echo "Package contents:"
          tar tzvf remote3-activity-lock-custom-ui.tar.gz

          echo "Checking required package entries..."
          tar tzf remote3-activity-lock-custom-ui.tar.gz | grep -qx './release.json'
          tar tzf remote3-activity-lock-custom-ui.tar.gz | grep -qx './bin/remote-ui'
          tar tzf remote3-activity-lock-custom-ui.tar.gz | grep -qx './config/'
          tar tzf remote3-activity-lock-custom-ui.tar.gz | grep -qx './data/'

          echo "Package SHA-256:"
          sha256sum remote3-activity-lock-custom-ui.tar.gz

      - name: Upload Remote 3 custom UI installation package
        uses: actions/upload-artifact@v4
        with:
          name: remote3-activity-lock-custom-ui
          path: remote3-activity-lock-custom-ui.tar.gz
          if-no-files-found: error
          retention-days: 7
