name: Build Remote 3 Activity Lock

on:
  push:
    branches: [main, activity-lock]
    paths:
      - 'tools/**'
      - '.github/workflows/**'
      - 'README.md'
  pull_request:
  workflow_dispatch:

env:
  UPSTREAM_COMMIT: f3d34daea76239a92b5d43793f9eb849e5d0fc19

jobs:
  embedded-arm64:
    name: Remote 3 ARM64 build
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout overlay
        uses: actions/checkout@v4
        with:
          path: overlay

      - name: Checkout upstream remote-ui
        uses: actions/checkout@v4
        with:
          repository: unfoldedcircle/remote-ui
          ref: ${{ env.UPSTREAM_COMMIT }}
          path: remote-ui
          submodules: recursive

      - name: Apply Activity Lock patch
        run: python3 overlay/tools/apply_activity_lock.py remote-ui

      - name: Build with official upstream ARM64 toolchain
        run: |
          docker pull unfoldedcircle/r2-toolchain-qt-5.15.8-static
          mkdir -p remote-ui/binaries/linux-arm64/release
          docker run --rm \
            --user=$(id -u):$(id -g) \
            -e UC_BIN=/sources/binaries/linux-arm64/release \
            -v "$PWD/remote-ui:/sources" \
            unfoldedcircle/r2-toolchain-qt-5.15.8-static \
            bash -lc 'cd /sources && qmake remote-ui.pro CONFIG+=release CONFIG+=static && make -j$(nproc)'

      - name: Verify ARM64 binary
        run: |
          test -f remote-ui/binaries/linux-arm64/release/remote-ui
          file remote-ui/binaries/linux-arm64/release/remote-ui

      - name: Upload Remote 3 firmware binary
        uses: actions/upload-artifact@v4
        with:
          name: remote3-activity-lock-arm64
          path: remote-ui/binaries/linux-arm64/release/remote-ui
